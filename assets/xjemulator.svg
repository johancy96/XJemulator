<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cuerpo del botón con degradado profundo -->
    <radialGradient id="button-body" cx="50%" cy="40%" r="50%" fx="50%" fy="30%">
      <stop offset="0%" style="stop-color:#16a316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#031a03;stop-opacity:1" />
    </radialGradient>
    
    <!-- Filtro para el efecto de hundimiento (Inner Shadow) -->
    <filter id="inner-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset dx="1" dy="1"/>
      <feGaussianBlur stdDeviation="1" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.8" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>

    <filter id="clean-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100" height="100" rx="22" fill="#121216"/>

  <!-- Cuerpo del botón -->
  <circle cx="50" cy="50" r="42" fill="url(#button-body)" stroke="#021402" stroke-width="1"/>
  
  <!-- Símbolo XJ Integrado (X como punto de la J) -->
  <g transform="translate(50, 48)">
    <!-- Resplandor neón -->
    <g filter="url(#clean-glow)" opacity="0.6">
       <!-- La X (Punto) -->
       <path d="M -8,-24 L 8,-12" stroke="#aaffaa" stroke-width="5" stroke-linecap="round"/>
       <path d="M 8,-24 L -8,-12" stroke="#aaffaa" stroke-width="5" stroke-linecap="round"/>
       <!-- La J (Cuerpo) -->
       <path d="M 0,-4 V 22 C 0,30 -8,32 -14,26" fill="none" stroke="#aaffaa" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- Símbolo principal con efecto de bajorrelieve -->
    <g filter="url(#inner-shadow)">
      <!-- La X (Punto) -->
      <path d="M -8,-24 L 8,-12" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
      <path d="M 8,-24 L -8,-12" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
      <!-- La J (Cuerpo) -->
      <path d="M 0,-4 V 22 C 0,30 -8,32 -14,26" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    </g>
  </g>

  <!-- Brillo superior para profundidad -->
  <ellipse cx="50" cy="28" rx="26" ry="12" fill="white" opacity="0.15"/>
</svg>
